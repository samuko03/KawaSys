{% extends "base.html" %}
{% block title %}Nueva Sucursal{% endblock %}
{% block page_title %}Registrar Sucursal{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="panel">
      <div class="panel-header">
        <h5><i class="bi bi-geo-alt me-2 text-danger"></i>Nueva Sucursal</h5>
        <a href="/sucursales/" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a>
      </div>
      <div class="panel-body">
        <form method="post" action="/sucursales/nueva">
          <div class="mb-3">
            <label class="form-label fw-semibold small">Nombre *</label>
            <input type="text" name="nombre" class="form-control" placeholder="Ej: Sucursal Norte" required/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Dirección</label>
            <input type="text" name="direccion" class="form-control" placeholder="Calle y número"/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Ciudad</label>
            <input type="text" name="ciudad" class="form-control"/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Teléfono</label>
            <input type="text" name="telefono" class="form-control"/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Email</label>
            <input type="email" name="email" class="form-control"/>
          </div>
          <button type="submit" class="btn btn-kawa w-100"><i class="bi bi-check2 me-2"></i>Registrar Sucursal</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
