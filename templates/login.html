<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>KawaSys - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="/static/css/kawasys.css" rel="stylesheet"/>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo">
      <img src="/static/img/logo.png" alt="KawaSys"/>
    </div>
    <h2>KawaSys</h2>
    <p>Sistema de Gestión - KAWA S.R.L.</p>

    {% if error %}
    <div class="alert alert-danger kawa-alert">
      <i class="bi bi-exclamation-circle me-2"></i>{{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login">
      <div class="mb-3">
        <label class="form-label fw-semibold small">Usuario</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario" required autofocus/>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold small">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required/>
        </div>
      </div>
      <button type="submit" class="btn btn-kawa w-100 py-2">
        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
      </button>
    </form>

    <div class="mt-4 p-3 rounded" style="background:#f8f9fa; font-size:0.78rem; color:#666;">
      <div class="fw-bold mb-2">Usuarios de prueba:</div>
      <div>👤 <strong>admin</strong> / admin123 — Sistema</div>
      <div>👤 <strong>ventas</strong> / ventas123 — Ventas</div>
      <div>👤 <strong>compras</strong> / compras123 — Compras</div>
      <div>👤 <strong>finanzas</strong> / finanzas123 — Finanzas</div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
