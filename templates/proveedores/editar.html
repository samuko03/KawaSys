{% extends "base.html" %}
{% block title %}Editar Proveedor{% endblock %}
{% block page_title %}Modificar Proveedor{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="panel">
      <div class="panel-header">
        <h5><i class="bi bi-pencil-square me-2 text-primary"></i>Editar: {{ proveedor.razon_social }}</h5>
        <a href="/proveedores/" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a>
      </div>
      <div class="panel-body">
        <form method="post" action="/proveedores/{{ proveedor.id }}/editar">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label fw-semibold small">Razón Social *</label>
              <input type="text" name="razon_social" class="form-control" value="{{ proveedor.razon_social }}" required/>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold small">CUIT</label>
              <input type="text" name="cuit" class="form-control" value="{{ proveedor.cuit or '' }}"/>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold small">Tipo</label>
              <select name="tipo" class="form-select">
                <option value="fijo" {% if proveedor.tipo=='fijo' %}selected{% endif %}>Fijo</option>
                <option value="alternativo" {% if proveedor.tipo=='alternativo' %}selected{% endif %}>Alternativo</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold small">Teléfono</label>
              <input type="text" name="telefono" class="form-control" value="{{ proveedor.telefono or '' }}"/>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold small">Email</label>
              <input type="email" name="email" class="form-control" value="{{ proveedor.email or '' }}"/>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold small">Dirección</label>
              <input type="text" name="direccion" class="form-control" value="{{ proveedor.direccion or '' }}"/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Marcas</label>
              <input type="text" name="marcas" class="form-control" value="{{ proveedor.marcas or '' }}"/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Modelos</label>
              <input type="text" name="modelos" class="form-control" value="{{ proveedor.modelos or '' }}"/>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-kawa w-100"><i class="bi bi-check2 me-2"></i>Guardar Cambios</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
