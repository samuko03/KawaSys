{% extends "base.html" %}
{% block title %}Nuevo Proveedor{% endblock %}
{% block page_title %}Registrar Proveedor{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="panel">
      <div class="panel-header">
        <h5><i class="bi bi-building-add me-2 text-success"></i>Nuevo Proveedor</h5>
        <a href="/proveedores/" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a>
      </div>
      <div class="panel-body">
        <form method="post" action="/proveedores/nuevo">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label fw-semibold small">Razón Social *</label>
              <input type="text" name="razon_social" class="form-control" required/>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold small">CUIT</label>
              <input type="text" name="cuit" class="form-control" placeholder="XX-XXXXXXXX-X"/>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold small">Tipo *</label>
              <select name="tipo" class="form-select">
                <option value="fijo">Fijo</option>
                <option value="alternativo">Alternativo</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold small">Teléfono</label>
              <input type="text" name="telefono" class="form-control"/>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold small">Email</label>
              <input type="email" name="email" class="form-control"/>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold small">Dirección</label>
              <input type="text" name="direccion" class="form-control"/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Marcas que abastece</label>
              <input type="text" name="marcas" class="form-control" placeholder="Ej: Honda, Yamaha, Kawasaki"/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Modelos que abastece</label>
              <input type="text" name="modelos" class="form-control" placeholder="Ej: XR150, FZ25, Z400"/>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-kawa w-100"><i class="bi bi-check2 me-2"></i>Registrar Proveedor</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
